name: docker

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  run:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t hackathon-webhook:ci .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e AZDO_ORG_URL=https://dev.azure.com/example \
            -e AZDO_PAT=dummy -e AI_REVIEWER_ID=dummy \
            -e AI_BASE_URL=http://ai.invalid/v1 \
            hackathon-webhook:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 0.5
          done
          docker logs smoke
          exit 1

  publish:
    name: Publish to ghcr.io
    # Never on pull requests: fork PRs must not be able to push images.
    if: github.event_name == 'push'
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The Dockerfile cross-compiles, so both platforms build natively
      # without QEMU.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
