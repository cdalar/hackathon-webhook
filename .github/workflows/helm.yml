name: helm

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  run:
    name: Helm
    runs-on: onctl-2
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: |
          helm lint charts/hackathon-webhook \
            --set azdo.orgURL=https://dev.azure.com/example,azdo.reviewerID=dummy \
            --set ai.baseURL=http://ai.invalid/v1,secrets.azdoPAT=dummy

  publish:
    name: Publish to Docker Hub
    # Only for release tags, so a chart version always matches an image tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: run
    runs-on: onctl-2
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u cdalar --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 → chart version 1.2.3 running image tag 1.2.3, which the docker
      # workflow publishes for the same git tag.
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/hackathon-webhook --version "$version" --app-version "$version"
          helm push "hackathon-webhook-chart-$version.tgz" oci://registry-1.docker.io/cdalar
