{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hackathon-webhook.fullname" . }}
  labels:
    {{- include "hackathon-webhook.labels" . | nindent 4 }}
type: Opaque
stringData:
  AZDO_PAT: {{ required "secrets.azdoPAT is required (or set existingSecret)" .Values.secrets.azdoPAT | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  AI_API_KEY: {{ .Values.secrets.aiAPIKey | quote }}
{{- end }}
